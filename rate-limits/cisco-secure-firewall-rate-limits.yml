note: >-
  Cisco publishes NO numeric rate limit for the cloud Secure Firewall APIs. The contract proves limits exist
  — TOO_MANY_REQUESTS is a member of the published CommonApiError errorCode enum — but no window, no quota,
  no burst allowance and no response header is documented anywhere in the developer documentation or either
  OpenAPI. An integrator cannot size a client, and an agent cannot back off on anything but a bare 429.
