  name: Cisco Security Cloud Control Firewall Manager API
  description: The Security Cloud Control Firewall Manager REST API — 160 operations across 119 paths for inventory
    management (FTD, ASA, device managers, on-prem FMC), connector management, object management, user and tenant
    management, remote-access VPN and MFA monitoring, changelogs, change requests, transaction tracking for asynchronous
    operations, fleet-wide command execution and Lucene-syntax search across the tenant. Bearer JWT authentication
    using a non-expiring Security Cloud Control API token.
