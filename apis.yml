aid: cisco-secure-firewall
name: Cisco Secure Firewall
description: Cisco Secure Firewall, the product line built on the Sourcefire technology Cisco acquired in 2013,
  covers the Firepower/Secure Firewall appliances, the Secure Firewall Management Center (FMC), the device manager
  (FDM), and cloud-delivered FMC under Cisco Security Cloud Control. Management is automated through the FMC REST
  API, an Ansible collection, and a community MCP server. The contract is served by each customer's own management
  center, so there is no central anonymously fetchable specification.
