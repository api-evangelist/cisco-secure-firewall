  MCP servers are local-stdio and were not introspected live, so every binding is by declared REST path
  (which the SCC server publishes per tool in TOOLS.md) matched against the spec — high confidence where the
  path matches a published path exactly, medium where the server declares a path the published spec does not
  carry. Those medium rows are the finding: the community server names FWM paths (/change-requests,
  /connectors, /meta/regions, /monitoring/ra-vpn-sessions, /objects, /search, /transactions, /users) that do
  not match the published v1 paths, which is consistent with the maintainer's own "7 path-broken" disclosure.
