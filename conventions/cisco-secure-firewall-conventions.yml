method: searched
source: >-
  https://developer.cisco.com/docs/cisco-security-cloud-control-firewall-manager/getting-started/,
  https://developer.cisco.com/docs/cisco-security-cloud-control-firewall-manager/authentication/,
  https://github.com/CiscoDevNet/scc-public-api-docs/blob/main/cdo/overview/searching.md,
  openapi/cisco-secure-firewall-scc-firewall-manager-openapi.yml,
