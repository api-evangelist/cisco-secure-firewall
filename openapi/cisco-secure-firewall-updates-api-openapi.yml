  /v1/cdfmc/api/fmc_platform/v1/updates/upgrades:
    post:
      deprecated: false
      description: '**Create a task to trigger a Threat Defense upgrade/readiness check on a list of devices or push an upgrade
        file to a list of devices. If neither pushUpgradeFileOnly nor readinessCheckOnly is set, execute upgrade on the device.
        _Check the response section for applicable examples (if any)._**'
      operationId: createUpgrade
      parameters:
      - description: Boolean for Snort version. When TRUE the device is set to Snort3, when FALSE the device is set to Snort2.
        in: query
        name: toggleToSnort3
        required: false
        schema:
          type: boolean
      - description: Boolean for upgrade revert. When TRUE backups are made so that the device may be reverted to the pre-upgrade
          version following an upgrade. When FALSE revert is not enabled for the device. By default this is TRUE. This option
          is not applicable to Hotfixes, for a Hotfix upgrade this option must be explicitly set to FALSE.
        in: query
        name: enableUpgradeRevert
        required: false
        schema:
          type: boolean
      - description: Boolean for auto upgrade cancel. When TRUE the upgrade is automatically cancelled and the device rolled
          back to the previous version (if possible) if the upgrade fails. When FALSE if the upgrade fails the device remains
          in the failed state and will not be automatically rolled back. By default this is FALSE. This option is not applicable
          to Patches or Hotfixes.
        in: query
        name: autoUpgradeCancel
        required: false
        schema:
          type: boolean
      - description: Boolean for readiness check. When TRUE run readiness check for the upgrade package on a list of devices.
          Not compatible with pushUpgradeFileOnly option.
        in: query
        name: readinessCheckOnly
        required: false
        schema:
          type: boolean
      - description: Boolean for upgrade file push. When TRUE push the upgrade file to a list of devices. Not compatible with
          readinessCheckOnly option.
        in: query
        name: pushUpgradeFileOnly
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            examples:
              'Example 1 : POST /api/fmc_platform/v1/updates/upgrades ( Push the specified upgrade package on the specified devices )':
