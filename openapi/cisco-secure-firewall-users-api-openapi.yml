                    domains:
                    - domainUUID1
                    - domainUUID2
                    id: User id
                    isUserEnabled: User enabled
                    links:
                      self: https://example.cisco.com/api/fmc_config/v1/domain/domainUUID/users/users/userID?offset=0&limit=1
                    name: User name
                    passwordLifetime: password lifetime
                    realname: Real Name
                    roles:
