  /v1/cdfmc/api/fmc_config/v1/domain/{domainUUID}/users/users:
    get:
      deprecated: false
      description: '**Get the list of all users on the FMC.**'
      operationId: getAllFMCUser
      parameters:
      - description: List of user roles for filtering. Specify using the format <code>roles:user_role1,user_roleN</code>
        in: query
        name: filter
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      - $ref: '#/components/parameters/offset'
        name: offset
      - $ref: '#/components/parameters/limit'
        name: limit
      - $ref: '#/components/parameters/expanded'
        name: expanded
      responses:
        '200':
          content:
            application/json:
              examples:
                'Example 1 : GET /fmc_config/v1/domain/domainUUID/users/users ( GET ALL method for Users )':
                  value:
                    items:
                    - id: userUUID
                      name: userName
                      type: User
                    links:
                      self: https://example.cisco.com/api//fmc_config/v1/domain/domainUUID/users/users?offset=0&limit=1
                    paging:
                      count: 1
                      limit: 1
                      offset: 0
                      pages: 1
                'Example 2 : GET /fmc_config/v1/domain/domainUUID/users/users ( GET ALL method for Users filtered by roles )':
                  value:
                    items:
                    - id: userUUID
                      name: userWithAdministratorRole
                      type: User
                    links:
                      self: https://example.cisco.com/api/fmc_config/v1/domain/domainUUID/users/users?offset=0&filter=roles%3AAdministrator
                    paging:
                      count: 1
                      limit: 25
                      offset: 0
                      pages: 1
                'Example 3 : GET /fmc_config/v1/domain/domainUUID/users/users ( GET ALL method for Users filtered by multiple roles )':
                  value:
                    items:
                    - id: userUUID
                      name: userWithAnyOfTheMentionedRoles
                      type: User
                    links:
                      self: https://example.cisco.com/api/fmc_config/v1/domain/domainUUID/users/users?offset=0&filter=roles%3ANetwork%20Admin%2CIntrusion%20Admin
                    paging:
                      count: 1
                      limit: 25
                      offset: 0
                      pages: 1
              schema:
                $ref: '#/components/schemas/FMCUserListContainer'
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                type: object
          description: Error
      tags:
      - Users
    servers:
