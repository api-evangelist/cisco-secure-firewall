        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: appGroupId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: leftRevision
        schema:
          format: int32
          type: integer
      - in: query
        name: rightRevision
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MpmAppGroupRevisionDiff'
          description: Ok
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
