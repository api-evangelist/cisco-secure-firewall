        rules:
          items:
            $ref: '#/components/schemas/MpmRuleRevisionDiff'
          type: array
        targets:
          $ref: '#/components/schemas/MpmTargetRelationshipDiff'
      type: object
    AppChangeBody:
      properties:
        info:
          $ref: '#/components/schemas/AppInfoChange'
      required:
      - info
      type: object
    EndpointInfoChange:
      properties:
        description:
          type: string
        name:
          type: string
        value:
          type: string
      type: object
    AppGroupInfoChange:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    MpmDynamicGroupRelationshipRevisionDiff:
      properties:
        added:
          items:
            type: string
          type: array
          uniqueItems: true
        removed:
          items:
            type: string
          type: array
          uniqueItems: true
      type: object
  securitySchemes:
    BearerJWT:
      bearerFormat: jwt
      scheme: bearer
      type: http
