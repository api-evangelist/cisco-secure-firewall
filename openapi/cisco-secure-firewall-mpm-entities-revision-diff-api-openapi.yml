          $ref: '#/components/schemas/AppGroupInfoChange'
      type: object
    MpmRuleRevisionDiffBody:
      properties:
        apgs:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        aps:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        dstDgs:
          $ref: '#/components/schemas/MpmDynamicGroupRelationshipRevisionDiff'
        dstEpgs:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        dstEps:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        info:
          $ref: '#/components/schemas/RuleInfoChange'
        srcDgs:
          $ref: '#/components/schemas/MpmDynamicGroupRelationshipRevisionDiff'
        srcEpgs:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        srcEps:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
      type: object
    MpmPolicyRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/MpmPolicyRevisionDiffBody'
        id:
          format: uuid
          type: string
      type: object
    MpmTargetRelationshipDiff:
      properties:
        added:
          items:
            type: string
          type: array
        removed:
          items:
            type: string
          type: array
      type: object
    EndpointGroupInfoChange:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    MpmNatRuleRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/MpmNatRuleRevisionDiffBody'
        id:
          format: uuid
          type: string
      type: object
    RuleInfoChange:
      properties:
        action:
          enum:
          - PERMIT
          - DENY
          type: string
        description:
          type: string
        enabled:
          type: boolean
        fullyPinned:
          type: boolean
        onClose:
          type: boolean
        onInit:
          type: boolean
        ruleGroup:
          type: string
      type: object
    MpmRuleRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/MpmRuleRevisionDiffBody'
        id:
          format: uuid
          type: string
      type: object
    MpmEndpointGroupRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/MpmEndpointGroupRevisionDiffBody'
        id:
          format: uuid
          type: string
      type: object
    MpmNatRuleRevisionDiffBody:
      properties:
        apMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        apTranslated:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        apgMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        dstEpMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        dstEpTranslated:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        dstEpgMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        info:
          $ref: '#/components/schemas/NatRuleInfoChange'
        srcEpMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        srcEpTranslated:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        srcEpgMatch:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
      type: object
    MpmEndpointRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/EndpointChangeBody'
        id:
          format: uuid
          type: string
      type: object
    NatRuleInfoChange:
      properties:
        appNatType:
          enum:
          - MATCH
          - STATIC
          type: string
        description:
          type: string
        dstNatType:
          enum:
          - MATCH
          - STATIC
          type: string
        enabled:
          type: boolean
        ruleGroup:
          type: string
        srcNatType:
          enum:
          - MATCH
          - STATIC
          - HIDE
          type: string
      type: object
    MpmPolicyRevisionDiffBody:
      properties:
