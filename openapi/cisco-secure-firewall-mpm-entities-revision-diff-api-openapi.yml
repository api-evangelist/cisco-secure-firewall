components:
  schemas:
    MpmRelationshipRevisionDiff:
      properties:
        added:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
        removed:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
        updated:
          items:
            format: uuid
            type: string
          type: array
          uniqueItems: true
      type: object
    MpmAppGroupRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/MpmAppGroupRevisionDiffBody'
        id:
          format: uuid
          type: string
      type: object
    MpmEndpointGroupRevisionDiffBody:
      properties:
        epgs:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        eps:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        info:
          $ref: '#/components/schemas/EndpointGroupInfoChange'
      type: object
    MpmAppRevisionDiff:
      properties:
        action:
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - NO_DIFF
          type: string
        body:
          $ref: '#/components/schemas/AppChangeBody'
        id:
          format: uuid
          type: string
      type: object
    PolicyRuleOrderChange:
      properties:
        newOrder:
          items:
            format: uuid
            type: string
          type: array
        oldOrder:
          items:
            format: uuid
            type: string
          type: array
      type: object
    AppInfoChange:
      properties:
        description:
          type: string
        name:
          type: string
        value:
          type: string
      type: object
    PolicyInfoChange:
      properties:
        description:
          type: string
        name:
          type: string
        policyType:
          enum:
          - SECURITY
          - GOVERNANCE_PREPEND
          - GOVERNANCE_APPEND
          - NAT
          type: string
      type: object
    EndpointChangeBody:
      properties:
        info:
          $ref: '#/components/schemas/EndpointInfoChange'
      required:
      - info
      type: object
    MpmAppGroupRevisionDiffBody:
      properties:
        apgs:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
        aps:
          $ref: '#/components/schemas/MpmRelationshipRevisionDiff'
