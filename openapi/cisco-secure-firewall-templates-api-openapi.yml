                    id: 0050568A-02BD-0ed3-0000-008589934661
                    type: AccessPolicy
                  description: Example of a Device Template
                  firewallMode: ROUTED
                  name: DeviceTemplateExample
            schema:
              $ref: '#/components/schemas/DeviceTemplates'
              type: object
        description: Device template payload.
        required: true
      responses:
