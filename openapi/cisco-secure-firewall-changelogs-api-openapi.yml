paths:
  /v1/changelogs:
    get:
      description: Get a list of Change Logs in the Security Cloud Control tenant.
      operationId: getChangelogs
      parameters:
      - description: The number of results to retrieve.
        in: query
        name: limit
        required: false
        schema:
          maximum: 200
          minimum: 0
          type: string
      - description: The offset of the results retrieved. The Security Cloud Control API uses the offset field to determine
          the index of the first result retrieved, and will retrieve `limit` results from the offset specified.
        in: query
        name: offset
        required: false
        schema:
          minimum: 0
          type: string
      - description: The searchText parameter serves as a flexible search option that allows for text-based filtering across
          all fields of the Change Log object. This parameter can be used independently to search for entries containing the
          specified text, or in combination with the q query parameter for more targeted results. When used with q, the search
          conditions of searchText are logically ANDed with the q parameter's criteria, ensuring that the returned entries
          satisfy both sets of conditions.
        in: query
        name: searchText
        required: false
        schema:
          type: string
      - description: The time range for which to retrieve Change Logs. This parameter cannot be used in conjunction with a
          query on the lastEventDate field.
        in: query
        name: timeRange
        required: false
        schema:
          enum:
          - 5m
          - 15m
          - 30m
          - 1h
          type: string
      - description: The query to execute. Use the Lucene Query Syntax to construct your query.
        example: fieldName:fieldValue
        in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogPage'
          description: List of Change Log objects
        '400':
          $ref: '#/components/responses/http400BadRequest'
        '401':
          $ref: '#/components/responses/http401Unauthorised'
        '403':
          $ref: '#/components/responses/http403Forbidden'
        '405':
          $ref: '#/components/responses/http405MethodNotAllowed'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonApiError'
          description: Internal server error.
      security:
      - bearerAuth: []
      summary: Get Change Logs
      tags:
      - Changelogs
    servers:
