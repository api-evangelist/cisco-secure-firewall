    http405MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonApiError'
      description: Method not allowed.
  schemas:
    AuthenticationError:
      properties:
        error:
          description: A human-readable error description in English.
          example: invalid_token
          type: string
        errorDescription:
          description: A human-readable error description in English.
          example: Your token is invalid
          type: string
    ChangelogPage:
      properties:
        count:
          description: The total number of results available.
          example: 100
          format: int32
          type: integer
        items:
          description: The list of items retrieved.
          items:
            $ref: '#/components/schemas/Changelog'
          type: array
        limit:
          description: The number of results retrieved.
          example: 50
          format: int32
          type: integer
        offset:
          description: The offset of the results retrieved. The Security Cloud Control API uses the offset field to determine
            the index of the first result retrieved, and will retrieve `limit` results from the offset specified.
          example: 0
          format: int32
          type: integer
      type: object
    Changelog:
      properties:
        entityName:
          description: The name of the device, manager or service to which the Change Log refers.
          example: example-asa
          type: string
        entityUid:
          description: The unique identifier, represented as a UUID, of the device, manager or service to which the Change
            Log refers.
          example: 7131daad-e813-4b8f-8f42-be1e241e8cdb
          format: uuid
          type: string
        events:
          description: The events recorded in this Change Log.
          items:
            $ref: '#/components/schemas/Event'
          type: array
        lastEventDate:
          description: 'The time (UTC; represented using the RFC-3339 standard) at which the last event in the changelog occurred.
            You can perform range queries on this endpoint using the syntax `[lastEventDate:YYYY-MM-ddTHH:mm:ssZ TO lastEventDate:YYYY-MM-ddTHH:mm:ssZ]`:
            please note that this will need to be URL-encoded.'
          format: date-time
          type: string
        status:
          description: The status of the Change Log.
          enum:
          - ACTIVE
          - COMPLETED
          - UNKNOWN
          example: ACTIVE
          type: string
        uid:
          description: The unique identifier, represented as a UUID, of the Change Log.
          example: 7131daad-e813-4b8f-8f42-be1e241e8cdb
          format: uuid
          type: string
      required:
      - uid
      type: object
    Event:
      properties:
        action:
          description: The action performed.
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - ERROR
          - UNKNOWN
          type: string
        changeRequestName:
          description: The name of the Change Request associated with the Change Log event.
          example: LH-12345
          type: string
        changeRequestUid:
          description: The unique identifier, represented as a UUID, of the Change Request associated with the Change Log
            event.
          example: 7131daad-e813-4b8f-8f42-be1e241e8cdb
          format: uuid
          type: string
        commands:
          description: The commands executed, if any, by the Change Log event.
          type: string
        date:
          description: The time (UTC; represented using the RFC-3339 standard) at which the Change Log Event occurred.
          format: date-time
          type: string
        description:
          description: A human-readable description of the Change Log event.
          type: string
        diff:
          description: A textual Diff representation of the changes made to the configuration.
          type: string
        username:
          description: The username of the user that triggered the Change Log event.
          example: myuser@cisco.com
          type: string
      type: object
    CommonApiError:
      properties:
        details:
          additionalProperties:
            description: Additional details, if any, on the error
            example: {}
            type: object
          description: Additional details, if any, on the error
          example: {}
          type: object
        errorCode:
          description: A unique code that describes the error.
          enum:
          - INVALID_INPUT
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - TOO_MANY_REQUESTS
          - SERVER_ERROR
          - PROXY_ERROR
          - BAD_REQUEST
          - UNPROCESSABLE_ENTITY
          example: INVALID_INPUT
          type: string
        errorMsg:
          description: A human-readable error description in English.
          example: sample error
          type: string
  securitySchemes:
