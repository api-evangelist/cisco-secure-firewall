components:
  schemas:
    Command:
      properties:
        body:
          description: The body of the command (optional).
          example: {}
          type: string
        link:
          description: The FMC endpoint to invoke for this command.
          example: /api/fmc_config/v1/domain/e276abec-e0f2-11e3-8169-6d9ed49b625f
          minLength: 1
          type: string
        method:
          description: The HTTP method for the command.
          example: GET
          minLength: 1
          type: string
      required:
      - link
      - method
      type: object
    DeviceGatewayApiRequest:
      properties:
        deviceUid:
          description: The unique identifier, represented as a UUID, of the target device for the command. Currently, only
            FMC devices are supported.
          example: 6e3492c6-083a-4ead-9da9-cd2db32a965d
          minLength: 1
          type: string
        request:
          $ref: '#/components/schemas/FmcRequest'
          description: The request that the user wants to execute on the device.
      required:
      - deviceUid
      - request
      type: object
    CommandResponse:
      properties:
        data:
          description: The data associated with the command response.
          example:
            inResponseTo:
              command: executeFmcRequests
              deviceType: fmc
              deviceUid: fb8e46fc-30b0-437f-921d-606c53d4b94c
              larUid: b5a71c7b-f309-4102-8fa2-9eec2260a1b7
            responseBody: '[{"id":"0050568A-5AB4-0ed3-0000-021474986635","name":"Marketing","agentId":"agent_007","topicName":"aws365","description":"IPs
              of marketing department","type":"DynamicObject","objectType":"IP"}]'
            responseStatus: SUCCESS
            tenantUid: 936fca6c-000b-4375-b903-46e6a95c7153
        message:
          description: The response message, if applicable.
          example: The request timed out due to a hard limit of 70 seconds. You may poll for a belated response using the
            url provided in the 'data' field
          type: string
        requestId:
          description: The unique identifier of the request, represented as a UUID.
          example: 6e3492c6-083a-4ead-9da9-cd2db32a965d
          type: string
        responseOrigin:
          description: The origin system of the response.
          enum:
          - device-gateway-api
          - secure-connector
          - secure-connector-sse
          example: secure-connector
          type: string
        status:
          description: The status of the command.
          enum:
          - failed
          - pending
          - responded
          - timeout
          example: responded
          type: string
      type: object
    FmcRequest:
      properties:
        commands:
          description: A list of commands to be executed on the device.
          items:
            $ref: '#/components/schemas/Command'
          minItems: 1
          type: array
      required:
      - commands
      type: object
    CommonApiError:
      properties:
        details:
          additionalProperties:
            description: Additional details, if any, on the error
            example: {}
            type: object
          description: Additional details, if any, on the error
          example: {}
          type: object
        errorCode:
          description: A unique code that describes the error.
          enum:
          - INVALID_INPUT
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - TOO_MANY_REQUESTS
          - SERVER_ERROR
          - PROXY_ERROR
          - BAD_REQUEST
          - UNPROCESSABLE_ENTITY
          example: INVALID_INPUT
          type: string
        errorMsg:
          description: A human-readable error description in English.
          example: sample error
          type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
