- name: Commands
paths:
  /v1/fmc/gateway/command:
    post:
      description: Send a direct command to the specified device.
      operationId: executeDeviceCommand
      parameters:
      - description: By default, the API waits up to 70 seconds for a device response. Append the 'async' flag to return immediately
          without waiting for the response.
        in: query
        name: async
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGatewayApiRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                responded:
                  value:
                    data:
                      inResponseTo:
                        command: executeFmcRequests
                        deviceType: fmc
                        deviceUid: fb8e46fc-30b0-437f-921d-606c53d4b94c
                        larUid: b5a71c7b-f309-4102-8fa2-9eec2260a1b7
                      responseBody: '[{"id":"0050568A-5AB4-0ed3-0000-021474986635","name":"Marketing","agentId":"agent_007","topicName":"aws365","description":"IPs
                        of marketing department","type":"DynamicObject","objectType":"IP","links":{"self":"https://fmc.acme.com/api/fmc_config/v1/domain/e276abe1-e0f2-11e3-8169-6d9ed49b625f/object/dynamicobjects/0050568C-5AB4-0ed3-0000-021474986635"},"metadata":{"domain":{"name":"Global","id":"e276abec-e0f2-11e3-8169-6d9ed49b625f","type":"Domain"}}}]'
                      responseStatus: SUCCESS
                      tenantUid: 936fca6c-000b-4375-b903-46e6a95c7153
                    requestId: 11111111-1111-1111-1111-111111111111
                    responseOrigin: secure-connector
                    status: responded
                timeout:
                  value:
                    data: The request timed out due to a hard limit of 70 seconds. You may poll for a belated response using
                      the url provided in the 'data' field
                    requestId: 11111111-1111-1111-1111-111111111111
                    responseOrigin: device-gateway-api
                    status: timeout
          description: The request was successfully processed, and the device command was executed.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonApiError'
          description: Internal server error.
      summary: Send a direct request to a registered device in Security Cloud Control
      tags:
      - Commands
    servers:
    - url: https://api.us.security.cisco.com/firewall
      description: US
    - url: https://api.eu.security.cisco.com/firewall
