          items:
            $ref: '#/components/schemas/MpmAppGroupObj'
          type: array
        appNatType:
          enum:
          - MATCH
          - STATIC
          type: string
        apsMatch:
          items:
            $ref: '#/components/schemas/MpmAppObj'
          type: array
        description:
          type: string
        dstEpTranslated:
          $ref: '#/components/schemas/MpmEndpointObj'
        dstEpgsMatch:
          items:
            $ref: '#/components/schemas/MpmEndpointGroupObj'
          type: array
        dstEpsMatch:
          items:
            $ref: '#/components/schemas/MpmEndpointObj'
          type: array
        dstNatType:
          enum:
          - MATCH
          - STATIC
          type: string
        enabled:
          type: boolean
        id:
          format: uuid
          type: string
        srcEpTranslated:
          $ref: '#/components/schemas/MpmEndpointObj'
        srcEpgsMatch:
          items:
            $ref: '#/components/schemas/MpmEndpointGroupObj'
          type: array
        srcEpsMatch:
          items:
            $ref: '#/components/schemas/MpmEndpointObj'
          type: array
        srcNatType:
          enum:
          - MATCH
          - STATIC
          - HIDE
          type: string
      type: object
  securitySchemes:
    BearerJWT:
      bearerFormat: jwt
      scheme: bearer
      type: http
