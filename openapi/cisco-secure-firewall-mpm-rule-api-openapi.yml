          - DENY
          type: string
        apgs:
          items:
            $ref: '#/components/schemas/MpmAppGroupObj'
          type: array
        aps:
          items:
            $ref: '#/components/schemas/MpmAppObj'
          type: array
        description:
          type: string
        dstDgs:
          items:
            $ref: '#/components/schemas/IdValue'
          type: array
        dstEpgs:
          items:
            $ref: '#/components/schemas/MpmEndpointGroupObj'
          type: array
        dstEps:
          items:
            $ref: '#/components/schemas/MpmEndpointObj'
          type: array
        enabled:
          type: boolean
        fullyPinned:
          type: boolean
        id:
          format: uuid
          type: string
        onClose:
          type: boolean
        onInit:
          type: boolean
        ruleGroup:
          type: string
        srcDgs:
          items:
            $ref: '#/components/schemas/IdValue'
          type: array
        srcEpgs:
          items:
            $ref: '#/components/schemas/MpmEndpointGroupObj'
          type: array
        srcEps:
          items:
            $ref: '#/components/schemas/MpmEndpointObj'
          type: array
      type: object
    MpmNatRuleObj:
      properties:
        apTranslated:
