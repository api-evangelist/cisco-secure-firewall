  /v1/cdfmc/api/fmc_config/v1/domain/{domainUUID}/backup/backuprecords:
    get:
      deprecated: false
      description: '**Get all backup lists from the database.**'
      operationId: getAllBackupRecord
      parameters:
      - description: Optional parameter to identify the backup type "Manager", "Device", and "All". Default will be "all"
          type.
        in: query
        name: systemType
        required: false
        schema:
          type: string
      - description: Optional parameter to identify the oldest date of backup. Defaults to the oldest date of the backup.
        in: query
        name: startDate
        required: false
        schema:
          type: string
      - description: Date of the most recent backup. By default, this is the latest backup date.
        in: query
        name: endDate
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      - $ref: '#/components/parameters/offset'
