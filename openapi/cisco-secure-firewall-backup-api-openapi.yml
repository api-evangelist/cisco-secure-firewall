  /v1/cdfmc/api/fmc_config/v1/domain/{domainUUID}/backup/operational/fetchbackupurl:
    get:
      deprecated: false
      description: '**Get the presigned URL of the download backup from the cloud.**'
      operationId: getFetchBackupURL
      parameters:
      - description: Filter backup links by ID. For example <code>ids:backupUUID1-1,backupUUID1-2,backupUUID1-3</code>.
        in: query
        name: filter
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      - $ref: '#/components/parameters/offset'
        name: offset
      - $ref: '#/components/parameters/limit'
        name: limit
      - $ref: '#/components/parameters/expanded'
        name: expanded
      responses:
        '200':
          content:
            application/json:
              examples:
                ? 'Example 1 : GET /fmc_config/v1/domain/DomainUUID/backup/operational/fetchbackupurl ( GET of backup file
                  download url link for the provided backup_uuid )'
                : value:
                    items:
                    - deviceName: FTD1
                      fileName: <backup-file-name>
                      id: <backup-file-uuid>
                      presignedUrl: <backup-file-url>
                      targetID: <device-uuid>
                    - deviceName: FTD2
                      fileName: <backup-file-name>
                      id: <backup-file-uuid>
                      presignedUrl: <backup-file-url>
                      targetID: <device-uuid>
                    links:
                      self: https://example.cisco.com/api/fmc_config/v1/domain/e276abec-e0f2-11e3-8169-6d9ed49b625f/backup/operational/fetchbackupurl
              schema:
