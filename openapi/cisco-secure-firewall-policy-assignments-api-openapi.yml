                  type: PolicyAssignment
              ? 'Example 5 : PUT /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/policyassignmentUUID ( PUT request to delete policy assignments of NAT policy )'
              : value:
                  id: policyassignmentUUID
                  policy:
