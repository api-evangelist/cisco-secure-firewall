                      description: policy to test FMC implementation
                      id: platformsettingspolicyUUID
                      name: FTDPlatformSettings1
                      type: FTDPlatformSettings
                    targets:
                    - id: deviceUUID
                      name: FTD_Device1
                      type: Device
                    type: PolicyAssignment
