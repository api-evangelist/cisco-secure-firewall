                    policy:
                      description: policy to test FMC implementation
                      id: accesspolicyUUID
                      name: AccessPolicy1
                      type: AccessPolicy
                    targets:
                    - id: deviceUUID
                      name: FTD_Device1
                      type: Device
                    type: PolicyAssignment
                ? 'Example 2 : GET /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/policyassignmentUUID ( GET by id on NAT policy )'
