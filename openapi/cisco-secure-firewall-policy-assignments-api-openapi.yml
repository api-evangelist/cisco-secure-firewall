paths:
  /v1/cdfmc/api/fmc_config/v1/domain/{domainUUID}/assignment/policyassignments:
    servers:
    - url: https://api.us.security.cisco.com/firewall
      description: US
    - url: https://api.eu.security.cisco.com/firewall
      description: EU
    - url: https://api.apj.security.cisco.com/firewall
      description: APJ
    - url: https://api.au.security.cisco.com/firewall
      description: AUS
    - url: https://api.in.security.cisco.com/firewall
      description: IN
    - url: https://api.int.security.cisco.com/firewall
      description: Staging
    - url: https://scale.manage.security.cisco.com/api/rest
      description: Scale
    - url: https://ci.manage.security.cisco.com/api/rest
      description: CI
    - url: https://manage.stg.secure.cisco/api/rest
      description: Stgf9
    get:
      deprecated: false
      description: '**Get the list of all policy assignments to target devices.**'
      operationId: getAllPolicyAssignment
      parameters:
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      - $ref: '#/components/parameters/offset'
        name: offset
      - $ref: '#/components/parameters/limit'
        name: limit
      - $ref: '#/components/parameters/expanded'
        name: expanded
      responses:
        '200':
          content:
            application/json:
              examples:
                'Example 1 : GET /fmc_config/v1/domain/DomainUUID/assignment/policyassignments ( Success: Test GET ALL success )':
                  value:
                    items:
                    - id: NatPolUuid
                      name: NATPOL
                      type: PolicyAssignment
                    - id: accessPolicyUuid
                      name: AccessPolicy1
                      type: PolicyAssignment
                    links:
                      self: /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/?offset=0&limit=2
                    paging:
                      count: 2
                      limit: 2
                      offset: 0
                      pages: 1
                ? 'Example 2 : GET /fmc_config/v1/domain/DomainUUID/assignment/policyassignments?expanded=true ( Success: Test GET ALL success with expanded=true )'
                : value:
                    items:
                    - id: NatPolUuid
                      links:
                        self: /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/NatPolUuid
                      name: NATPOL
                      policy:
                        id: NatPolUuid
                        name: NATPOL
                        type: FTDNatPolicy
                      targets:
                      - id: device1Uuid
                        keepLocalEvents: false
                        name: FTD_Device1
                        prohibitPacketTransfer: false
                        type: Device
                      - id: device2Uuid
                        keepLocalEvents: false
                        name: FTD_Device2
                        prohibitPacketTransfer: false
                        type: Device
                      type: PolicyAssignment
                    - id: accessPolicyUuid
                      links:
                        self: /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/accessPolicyUuid
                      name: AccessPolicy1
                      policy:
                        id: accessPolicyUuid
                        name: AccessPolicy1
                        type: AccessPolicy
                      targets:
                      - id: FP_DeviceUuid
                        keepLocalEvents: false
                        name: FP_device
                        prohibitPacketTransfer: false
                        type: Device
                      - id: device1Uuid
                        keepLocalEvents: false
                        name: FTD_Device1
                        prohibitPacketTransfer: false
                        type: Device
                      - id: device2Uuid
                        keepLocalEvents: false
                        name: FTD_Device2
                        prohibitPacketTransfer: false
                        type: Device
                      type: PolicyAssignment
                    links:
                      self: /fmc_config/v1/domain/DomainUUID/assignment/policyassignments/?offset=0&limit=2&expanded=true
                    paging:
                      count: 2
                      limit: 2
                      offset: 0
                      pages: 1
              schema:
                $ref: '#/components/schemas/PolicyAssignmentListContainer'
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                type: object
          description: Error
      tags:
      - Policy Assignments
    post:
      deprecated: false
      description: '**Create a policy assignment. _Check the response section for applicable examples (if any)._**'
      operationId: createPolicyAssignment
      parameters:
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      requestBody:
        content:
          application/json:
            examples:
              ? 'Example 1 : POST /fmc_config/v1/domain/DomainUUID/assignment/policyassignments ( POST request to assign device to an FTDPlatformSettings policy )'
              : value:
                  policy:
                    id: ftdplatformsettingspolicyUUID
                    name: FTDPlatformSettingsPolicy2
                    type: FTDPlatformSettingsPolicy
                  targets:
                  - id: deviceUUID1
                    name: FTD_Device1
                    type: Device
                  - id: deviceUUID2
                    name: FTD_Device2
                    type: Device
                  type: PolicyAssignment
              ? 'Example 2 : POST /fmc_config/v1/domain/DomainUUID/assignment/policyassignments ( POST request to assign device to an AC policy )'
              : value:
                  policy:
                    id: accesspolicyUUID
                    name: AccessPolicy2
                    type: AccessPolicy
                  targets:
                  - id: deviceUUID1
                    name: FTD_Device1
                    type: Device
                  - id: deviceUUID2
                    name: FTD_Device2
                    type: Device
                  type: PolicyAssignment
              ? 'Example 3 : POST /fmc_config/v1/domain/DomainUUID/assignment/policyassignments ( POST request to assign device to an FlexConfig policy )'
              : value:
                  policy:
                    id: flexconfigpolicyUUID
                    name: FlexConfigPolicy2
                    type: FlexConfigPolicy
                  targets:
                  - id: deviceUUID1
                    name: FTD_Device1
                    type: Device
                  - id: deviceUUID2
                    name: FTD_Device2
                    type: Device
                  type: PolicyAssignment
              ? 'Example 4 : POST /fmc_config/v1/domain/DomainUUID/assignment/policyassignments ( POST request to assign device(s) to a NAT policy )'
              : value:
                  policy:
                    id: NatPol1_uuid
                    name: NatPol1
                    type: FTDNatPolicy
                  targets:
                  - id: FTD_Device1_uuid
                    name: FTD_Device1
                    type: Device
                  - id: FTD_Device2_uuid
                    name: FTD_Device2
                    type: Device
                  type: PolicyAssignment
            schema:
              $ref: '#/components/schemas/PolicyAssignment'
              type: object
        description: The input policy assignment model.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAssignment'
                type: object
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                type: object
          description: Error
      tags:
      - Policy Assignments
