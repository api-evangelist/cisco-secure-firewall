      tags:
      - Adjacent Zone
  /topology/zone-path/adjacent-zones/zone/{id}:
    get:
      description: 'Roles allowed: support,topology-rw,topology-ro'
      operationId: getAdjacentZones
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
