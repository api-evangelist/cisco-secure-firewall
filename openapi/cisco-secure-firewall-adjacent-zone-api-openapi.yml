components:
  schemas:
    ZonePair:
      properties:
        zoneOneId:
          type: string
        zoneTwoId:
          type: string
      required:
      - zoneOneId
      - zoneTwoId
      type: object
    AdjacentZones:
      properties:
        adjacentZones:
          items:
            $ref: '#/components/schemas/ZonePair'
          type: array
      type: object
    AdjacentZoneToGatewaySet:
      properties:
        gatewaySetId:
          type: string
        zoneOneId:
          type: string
        zoneTwoId:
          type: string
      required:
      - gatewaySetId
      - zoneOneId
      - zoneTwoId
      type: object
    AdjacentZonesToGatewaySets:
      properties:
        adjacentZonesToGatewaySets:
          items:
            $ref: '#/components/schemas/AdjacentZoneToGatewaySet'
          type: array
      type: object
    ReqIdAndReqSystem:
      properties:
        id:
          example: 03502bc3-c140-4951-b467-bd17312a9b0b
          type: string
        requestingSystem:
          enum:
          - PCM
          - SDI
          - MPM
          - RED
          - SEEDING
          - TOPOLOGY
          - PCM_TOPOLOGY_CHANGE
          - SDI_TOPOLOGY_CHANGE
          - MPM_SECURITY_TOPOLOGY_CHANGE
          - MPM_POLICY_IMPORT
          - ZONE_PATH_TOPOLOGY_CHANGE
          - MPM_MULTI_POLICY_PUSH
          - GOVERNANCE_POLICY_DYNAMIC_GROUP_CHANGE
          type: string
      type: object
    TopologyRequestsResponse:
      properties:
        requests:
          items:
            $ref: '#/components/schemas/ReqIdAndReqSystem'
          type: array
      type: object
    TopologyRequestResponse:
      properties:
        request:
          $ref: '#/components/schemas/ReqIdAndReqSystem'
      type: object
  securitySchemes:
    BearerJWT:
      bearerFormat: jwt
      scheme: bearer
      type: http
