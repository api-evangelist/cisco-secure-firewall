  /v1/cdfmc/api/fmc_config/v1/domain/{domainUUID}/analysis/activesessions:
    delete:
      deprecated: false
      description: '**Administratively logout active user session. _Check the response section for applicable examples (if
        any)._**'
      operationId: deleteMultipleActiveSession
      parameters:
      - description: should always be set to true
        in: query
        name: bulk
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/domainUUID'
        name: domainUUID
      requestBody:
        content:
          application/json:
            examples:
              'Example 1 : DELETE /fmc_config/v1/domain/domainUUID/analysis/activesessions ( Success: Test logout )':
                value:
                  ids:
                  - id1
                  - id2
                  - id3
            schema:
              $ref: '#/components/schemas/ActiveSession'
              type: object
        description: list ids of sessions to logout
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                'Example 1 : DELETE /fmc_config/v1/domain/domainUUID/analysis/activesessions ( Success: Test logout )':
