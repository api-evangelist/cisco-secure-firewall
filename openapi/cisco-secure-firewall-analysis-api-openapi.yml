                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                type: object
          description: Error
      tags:
      - Analysis
    get:
      deprecated: false
      description: '**Retrieves active sessions.**'
      operationId: getAllActiveSession
      parameters:
      - description: 'Search based on user ID.Operator: <code>EQUALS</code>.'
        in: query
        name: userId
        required: false
        schema:
          type: number
      - description: 'Search based on the session login time, format: <code>{before|after}:{loginTime}</code> or <code>after:{loginTime},before:{loginTime}</code>,
          where loginTime takes Long value (Unix Timestamp).'
        in: query
        name: loginTime
        required: false
        schema:
          type: string
      - description: Search based on the time when the user was last seen. Format and values as for loginTime.
        in: query
        name: lastSeen
        required: false
        schema:
          type: string
      - description: 'Search based on user username. Operator: <code>CONTAINS</code> (i.e. search for ana will return users
          with usernames ana, banana, canada if they have active sessions)'
        in: query
        name: username
        required: false
        schema:
          type: string
      - description: 'Search based on user email. Operator: <code>CONTAINS</code>.'
        in: query
        name: email
        required: false
        schema:
          type: string
      - description: 'Search based on user department. Operator: <code>EQUALS</code>.'
